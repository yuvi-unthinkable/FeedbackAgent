<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Live Call & AI Telemetry Logs | FeedbackAgent</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0e17;
      --card-bg: rgba(17, 24, 39, 0.85);
      --border: rgba(255, 255, 255, 0.08);
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --text: #f3f4f6;
      --text-muted: #9ca3af;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Outfit', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
      padding: 0.9rem 1.5rem;
    }
    .header-content {
      max-width: 1400px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1rem;
    }
    .logo-area {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    .live-dot {
      width: 10px;
      height: 10px;
      background: #10b981;
      border-radius: 50%;
      box-shadow: 0 0 10px #10b981;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0% { transform: scale(0.95); opacity: 0.8; }
      50% { transform: scale(1.3); opacity: 1; }
      100% { transform: scale(0.95); opacity: 0.8; }
    }
    h1 { font-size: 1.25rem; font-weight: 600; letter-spacing: -0.02em; display: flex; align-items: center; gap: 0.5rem; }
    .status-badge {
      font-size: 0.75rem;
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.3);
      padding: 0.2rem 0.6rem;
      border-radius: 9999px;
      font-weight: 500;
      font-family: 'JetBrains Mono', monospace;
    }
    .nav-actions {
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }
    .btn {
      background: #1f2937;
      color: #e5e7eb;
      border: 1px solid var(--border);
      padding: 0.45rem 0.85rem;
      border-radius: 8px;
      font-family: inherit;
      font-size: 0.85rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      transition: all 0.2s;
      text-decoration: none;
    }
    .btn:hover { background: #374151; color: white; border-color: rgba(255,255,255,0.2); }
    .btn-primary { background: var(--primary); border-color: var(--primary); color: white; font-weight: 500; }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-danger { background: rgba(239, 68, 68, 0.15); border-color: rgba(239, 68, 68, 0.3); color: #f87171; }
    .btn-danger:hover { background: rgba(239, 68, 68, 0.3); color: white; }
    
    .stats-bar {
      max-width: 1400px;
      width: 100%;
      margin: 1.2rem auto 0;
      padding: 0 1.5rem;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1rem;
    }
    .stat-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1rem 1.2rem;
    }
    .stat-label { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; }
    .stat-value { font-size: 1.5rem; font-weight: 700; margin-top: 0.25rem; font-family: 'JetBrains Mono', monospace; }
    
    .toolbar {
      max-width: 1400px;
      width: 100%;
      margin: 1.2rem auto 0;
      padding: 0 1.5rem;
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
    }
    .search-input {
      background: rgba(17, 24, 39, 0.7);
      border: 1px solid var(--border);
      color: white;
      padding: 0.5rem 1rem;
      border-radius: 8px;
      font-family: inherit;
      font-size: 0.88rem;
      min-width: 280px;
      outline: none;
    }
    .search-input:focus { border-color: var(--primary); }
    .filters {
      display: flex;
      gap: 0.4rem;
      flex-wrap: wrap;
    }
    .filter-pill {
      background: rgba(31, 41, 55, 0.6);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 0.35rem 0.75rem;
      border-radius: 9999px;
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .filter-pill.active {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }
    .auto-refresh-toggle {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.82rem;
      color: var(--text-muted);
      cursor: pointer;
    }

    main {
      max-width: 1400px;
      width: 100%;
      margin: 1.2rem auto 2rem;
      padding: 0 1.5rem;
      flex: 1;
    }
    .logs-container {
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
    }
    .log-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.9rem 1.15rem;
      display: flex;
      flex-direction: column;
      gap: 0.45rem;
      transition: border-color 0.2s;
    }
    .log-card:hover { border-color: rgba(255, 255, 255, 0.2); }
    .log-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
    }
    .log-tag-group {
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }
    .badge {
      font-size: 0.72rem;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 600;
      padding: 0.2rem 0.55rem;
      border-radius: 6px;
      letter-spacing: 0.05em;
    }
    .badge-USER-SPEECH { background: rgba(16, 185, 129, 0.15); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.3); }
    .badge-GEMINI-AI, .badge-AI-RESPONSE { background: rgba(139, 92, 246, 0.15); color: #c084fc; border: 1px solid rgba(139, 92, 246, 0.3); }
    .badge-CALL-INIT, .badge-CALL-STATUS, .badge-TWILIO-CALL { background: rgba(6, 182, 212, 0.15); color: #38bdf8; border: 1px solid rgba(6, 182, 212, 0.3); }
    .badge-REPORT-WORKER { background: rgba(20, 184, 166, 0.15); color: #2dd4bf; border: 1px solid rgba(20, 184, 166, 0.3); }
    .badge-ERROR { background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); }
    .badge-DEFAULT { background: rgba(107, 114, 128, 0.15); color: #9ca3af; border: 1px solid rgba(107, 114, 128, 0.3); }
    
    .log-time {
      font-size: 0.75rem;
      font-family: 'JetBrains Mono', monospace;
      color: var(--text-muted);
    }
    .log-body {
      font-size: 0.95rem;
      line-height: 1.5;
      color: #e5e7eb;
    }
    .speech-bubble {
      font-size: 1rem;
      font-weight: 500;
      padding: 0.5rem 0.75rem;
      border-radius: 8px;
      margin-top: 0.25rem;
    }
    .speech-user {
      background: rgba(16, 185, 129, 0.08);
      border-left: 3px solid #10b981;
      color: #ecfdf5;
    }
    .speech-gemini {
      background: rgba(139, 92, 246, 0.08);
      border-left: 3px solid #8b5cf6;
      color: #f5f3ff;
    }
    .log-details {
      margin-top: 0.35rem;
      background: rgba(0, 0, 0, 0.4);
      padding: 0.6rem 0.8rem;
      border-radius: 6px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      color: #9ca3af;
      white-space: pre-wrap;
      overflow-x: auto;
    }
    .empty-state {
      text-align: center;
      padding: 4rem 2rem;
      color: var(--text-muted);
      background: var(--card-bg);
      border: 1px dashed var(--border);
      border-radius: 12px;
    }
  </style>
</head>
<body>
  <header>
    <div class="header-content">
      <div class="logo-area">
        <div class="live-dot"></div>
        <h1>FeedbackAgent <span>Live Call & AI Telemetry</span></h1>
        <span class="status-badge" id="connStatus">POLLING (1s)</span>
      </div>
      <div class="nav-actions">
        <a href="http://localhost:3000" target="_blank" class="btn btn-primary">🩺 Open React Studio</a>
        <button class="btn" onclick="fetchLogs()">🔄 Refresh</button>
        <button class="btn" onclick="exportLogs()">📥 Export JSON</button>
        <button class="btn btn-danger" onclick="clearLogs()">🧹 Clear Logs</button>
      </div>
    </div>
  </header>

  <section class="stats-bar">
    <div class="stat-card">
      <div class="stat-label">Total Events</div>
      <div class="stat-value" id="statTotal">0</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Spoken Turns (User & AI)</div>
      <div class="stat-value" id="statSpeech" style="color: #c084fc;">0</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Active Calls</div>
      <div class="stat-value" id="statCalls" style="color: #38bdf8;">0</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">AI Engine</div>
      <div class="stat-value" style="font-size: 1.15rem; color: #34d399;">Google Gemini 3.5</div>
    </div>
  </section>

  <div class="toolbar">
    <input type="text" id="searchInput" class="search-input" placeholder="🔍 Search caller, speech, or status..." oninput="renderLogs()" />
    <div class="filters">
      <button class="filter-pill active" data-filter="ALL" onclick="setFilter('ALL')">All</button>
      <button class="filter-pill" data-filter="SPEECH" onclick="setFilter('SPEECH')">🗣️ Speech & AI</button>
      <button class="filter-pill" data-filter="CALLS" onclick="setFilter('CALLS')">📞 Calls & Status</button>
      <button class="filter-pill" data-filter="REPORTS" onclick="setFilter('REPORTS')">🩺 Reports & Appointments</button>
      <button class="filter-pill" data-filter="ERRORS" onclick="setFilter('ERRORS')">❌ Errors</button>
    </div>
    <label class="auto-refresh-toggle">
      <input type="checkbox" id="autoRefreshToggle" checked /> Auto-refresh (1s)
    </label>
  </div>

  <main>
    <div class="logs-container" id="logsContainer">
      <div class="empty-state">
        <div style="font-size: 2rem; margin-bottom: 0.5rem;">📡</div>
        <h3>Waiting for live call telemetry...</h3>
        <p style="margin-top: 0.4rem; font-size: 0.9rem;">Trigger a call from the React Studio or Twilio to see live speech turns and AI responses here.</p>
      </div>
    </div>
  </main>

  <script>
    let allLogs = [];
    let currentFilter = 'ALL';
    let activeCallsCount = 0;

    async function fetchLogs() {
      try {
        const res = await fetch('/api/logs');
        if (res.ok) {
          const data = await res.json();
          allLogs = data.logs || [];
          activeCallsCount = data.activeCalls || 0;
          updateStats();
          renderLogs();
        }
      } catch (err) {
        console.error('Failed to fetch logs:', err);
      }
    }

    function setFilter(filter) {
      currentFilter = filter;
      document.querySelectorAll('.filter-pill').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.filter === filter);
      });
      renderLogs();
    }

    function updateStats() {
      document.getElementById('statTotal').innerText = allLogs.length;
      const speechTurns = allLogs.filter(l => l.category === 'USER-SPEECH' || l.category === 'GEMINI-AI' || l.category === 'AI-RESPONSE').length;
      document.getElementById('statSpeech').innerText = speechTurns;
      document.getElementById('statCalls').innerText = activeCallsCount;
    }

    function renderLogs() {
      const container = document.getElementById('logsContainer');
      const search = (document.getElementById('searchInput').value || '').toLowerCase();

      const filtered = allLogs.filter(log => {
        // Filter by category pill
        if (currentFilter === 'SPEECH') {
          if (!['USER-SPEECH', 'GEMINI-AI', 'AI-RESPONSE'].includes(log.category)) return false;
        } else if (currentFilter === 'CALLS') {
          if (!['CALL-INIT', 'CALL-STATUS', 'TWILIO-CALL', 'STREAM-STATUS'].includes(log.category)) return false;
        } else if (currentFilter === 'REPORTS') {
          if (!['REPORT-WORKER'].includes(log.category)) return false;
        } else if (currentFilter === 'ERRORS') {
          if (!['ERROR'].includes(log.category)) return false;
        }

        // Search text
        if (search) {
          const matchMsg = (log.message || '').toLowerCase().includes(search);
          const matchCat = (log.category || '').toLowerCase().includes(search);
          const matchDet = (log.details || '').toLowerCase().includes(search);
          return matchMsg || matchCat || matchDet;
        }
        return true;
      });

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <div style="font-size: 2rem; margin-bottom: 0.5rem;">🔍</div>
            <h3>No matching telemetry entries</h3>
            <p style="margin-top: 0.4rem; font-size: 0.9rem;">Try clearing your search query or switching filters.</p>
          </div>
        `;
        return;
      }

      container.innerHTML = filtered.map(log => {
        const badgeClass = `badge-${log.category}` in {
          'badge-USER-SPEECH': 1,
          'badge-GEMINI-AI': 1,
          'badge-AI-RESPONSE': 1,
          'badge-CALL-INIT': 1,
          'badge-CALL-STATUS': 1,
          'badge-TWILIO-CALL': 1,
          'badge-REPORT-WORKER': 1,
          'badge-ERROR': 1
        } ? `badge-${log.category}` : 'badge-DEFAULT';

        let speechHtml = '';
        if (log.category === 'USER-SPEECH') {
          speechHtml = `<div class="speech-bubble speech-user">🗣️ <strong>Caller:</strong> ${escapeHtml(log.message.replace(/^Caller.*?:/i, '').replace(/["']/g, ''))}</div>`;
        } else if (log.category === 'GEMINI-AI' || log.category === 'AI-RESPONSE') {
          speechHtml = `<div class="speech-bubble speech-gemini">✨ <strong>Google Gemini:</strong> ${escapeHtml(log.message.replace(/^(Dr\. AI|AI).*?:/i, '').replace(/["']/g, ''))}</div>`;
        }

        const detailsHtml = log.details ? `<div class="log-details">${escapeHtml(log.details)}</div>` : '';

        return `
          <div class="log-card">
            <div class="log-header">
              <div class="log-tag-group">
                <span class="badge ${badgeClass}">${log.category}</span>
                <span style="font-weight: 500; font-size: 0.9rem;">${escapeHtml(log.message)}</span>
              </div>
              <span class="log-time">${log.timeFormatted || log.timestamp}</span>
            </div>
            ${speechHtml}
            ${detailsHtml}
          </div>
        `;
      }).join('');
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    async function clearLogs() {
      if (!confirm('Clear telemetry log history?')) return;
      await fetch('/api/logs/clear', { method: 'POST' });
      fetchLogs();
    }

    function exportLogs() {
      const blob = new Blob([JSON.stringify(allLogs, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `telemetry-logs-${Date.now()}.json`;
      a.click();
      URL.revokeObjectURL(url);
    }

    // Auto-refresh interval
    setInterval(() => {
      const enabled = document.getElementById('autoRefreshToggle').checked;
      if (enabled) {
        fetchLogs();
      }
    }, 1000);

    // Initial load
    fetchLogs();
  </script>
</body>
</html>
